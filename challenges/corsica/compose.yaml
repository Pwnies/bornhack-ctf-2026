services:
  web_corsica:
    build:
      context: ./challenge/
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4.0"
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
