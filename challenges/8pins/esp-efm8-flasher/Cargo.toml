[package]
name = "esp-efm8-flasher"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32c3", "unstable"] }
esp-backtrace = { version = "0.19.0", features = [
    "esp32c3",
    "panic-handler",
    "println",
]}
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"]}
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
log = "0.4.32"
critical-section = "1.2.0"
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32c3"] }
embassy-executor = "0.10.0"
heapless = "0.9.3"
embassy-time = "0.5.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
dshot-frame = "0.2.1"
embedded-io-async = "0.7.0"
embassy-futures = "0.1.2"

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
